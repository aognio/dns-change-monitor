# Configuration of the DNS change monitor.
#
# Every value below can be overridden on the command line with --config, and
# the bot token can also be supplied through the DNSMON_TELEGRAM_TOKEN
# environment variable so that it never has to be written down.

[database]
# Location of the SQLite file holding the monitored records, the detected
# changes, the pairing tokens and the subscribers.
path = "data/dnsmon.db"

[telegram]
# The token issued by BotFather when the bot was created.
token = "123456789:replace-me-with-the-token-of-your-bot"

# The accounts allowed to pair with the bot and to receive the reports.
# A leading @ is accepted and removed.
notify_usernames = ["alice", "bob"]

# How long a long poll request waits for new updates.
poll_timeout_seconds = 30

[monitor]
# The delay between two consecutive checks of the monitored records.
interval_seconds = 60

# The name servers used by the records that do not name one.
resolvers = ["1.1.1.1:53", "8.8.8.8:53"]

# The timeout of a single query.
timeout_seconds = 5

# Whether the first observation of a record is reported. The first
# observation only establishes the reference the following ones are compared
# to, so it is silent by default.
notify_on_baseline = false

# The records to watch. They are reconciled with the database at every
# start: a record removed from this file stops being watched.
#
# A record may also declare how it is checked, with the mode key:
#
#   change  the default, the answer is compared with the previous
#           observation and there is no value to check against
#   any     the record must carry at least one answer
#   exact   the answer must be exactly the listed values
#   regex   at least one answer must match the listed pattern, which is a
#           Go regular expression (RE2) searched anywhere in the answer
#
# The expectations are validated while this file is read, so a broken
# declaration never reaches the database.
[[monitor.records]]
name = "example.com"
type = "A"

# The answer must be exactly 1.2.3.4.
#[[monitor.records]]
#name = "example.com"
#type = "A"
#mode = "exact"
#expect = ["1.2.3.4"]

# At least one answer must match the pattern.
#[[monitor.records]]
#name = "example.com"
#type = "TXT"
#mode = "regex"
#expect = ["^v=spf1"]

# The record must exist.
#[[monitor.records]]
#name = "example.com"
#type = "NS"
#mode = "any"

[pairing]
# How long a pairing token stays redeemable.
token_ttl_minutes = 30

[daemon]
# Where the background daemon records its process identifier and writes its
# output.
pid_file = "data/dnsmon.pid"
log_file = "data/dnsmon.log"

[log]
# One of debug, info, warn or error.
level = "info"
# One of text or json. It applies to the standard output only.
format = "text"
# The plain text log file, one line per event. It is always written as
# plain text, whatever the format of the standard output is.
file = "data/dnsmon-events.log"
# The minimum severity written to the log file. It defaults to the level
# of the standard output.
file_level = "info"
